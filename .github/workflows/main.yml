name: Build Boat APK

on:
  push:
    branches: [ "Material-You" ] # Agar aapki branch ka naam alag hai toh yahan badal dena
  workflow_dispatch: # Isse aap manually bhi build start kar sakte ho

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Boat-H2O2-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
